[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-collector"
version = "0.1.0"
description = "Pluggable wallet-intel collector (GMGN smart-money, real Helius API, GeckoTerminal enrichment) that emits observation traces into a Mycelium substrate, local or remote."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mycelium-collector = "mycelium_collector.cli:main"

[tool.setuptools.packages.find]
include = ["mycelium_collector*"]
