[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picks-client"
version = "0.1.0"
description = "Client for a picks digest service (GET /api/picks) -- config-driven PICKS_URL, no hardcoded host."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
picks-digest = "picks_client.cli:main"

[tool.setuptools.packages.find]
include = ["picks_client*"]
