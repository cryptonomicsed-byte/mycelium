[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "substrate-tunnel"
version = "0.1.0"
description = "Generic autossh-managed reverse-SSH tunnel to join any device (VPS/desktop/phone) to a shared Mycelium substrate host. Was Fold4's hardcoded council-tunnel script."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
substrate-tunnel = "substrate_tunnel.cli:main"

[tool.setuptools.packages.find]
include = ["substrate_tunnel*"]
